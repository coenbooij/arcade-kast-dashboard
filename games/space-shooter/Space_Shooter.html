<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
       
        body {
            background: black;
        }
       
        canvas {
            background: url(Galaxy_1.jpg);
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="1920" height="1080"></canvas>
    <script>
        const showHitboxes = false; // Variabele om hitboxen te tonen of te verbergen
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const shipImage = new Image();
        shipImage.src = 'Spaceship.png';

        const meteorImages = [
            'Meteoriet 1 pixelated wo background.png',
            'Meteoriet 2 pixelated wo background.png',
            'Meteoriet 3 pixelated wo background.png'
        ].map(src => {
            const img = new Image();
            img.src = src;
            return img;
        });

        const meteorHitboxes = [
        // Meteoriet 1
        {x: 0, y: 0, width: 50, height: 30},
        // Meteoriet 2
        {x: 10, y: 0, width: 30, height: 30},
        // Meteoriet 3
        {x: 10, y: 0, width: 30, height: 30}
    ];

        const ship = {
            x: canvas.width / 2,
            y: canvas.height - 45,
            width: 60,
            height: 80,
            dx: 5,
            dy: 5
        };

        const bullets = [];
        const enemies = [];
        const powerUps = [];
        let enemySpeed = 2;
        let gameOver = false;
        let score = 0;
        let bulletColor = 'red';
        let lastBulletTime = 0;
        let bulletCooldown = 250; // 250ms = 4 shots per second
        let originalBulletCooldown = 250;
        
        let bulletWidth = 10;
        let bulletHeight = 20;
        let activePowerUpTimer = null;

        
        let lastSpawnTime = 0;
        let spawnInterval = 1000;  // Starting spawn interval in milliseconds

        let restartDelay = 3000; // 3 seconden wachten
        let restartTimer = null;
        let showRestartText = false;
        
        function drawShip() {
            if (shipImage.complete) {
                ctx.drawImage(shipImage, ship.x, ship.y, ship.width, ship.height);
            } else {
                ctx.fillStyle = 'white';
                ctx.fillRect(ship.x, ship.y, ship.width, ship.height);
            }
            if (showHitboxes) {
                ctx.strokeStyle = 'blue';
                ctx.strokeRect(ship.x, ship.y, ship.width, ship.height);
            }
        }

        function drawBullets() {
            ctx.fillStyle = bulletColor;
            bullets.forEach(bullet => {
                ctx.fillRect(bullet.x, bullet.y, bulletWidth, bulletHeight);
            });
        }

        function drawEnemies() {
            enemies.forEach(enemy => {
                if (enemy.image.complete) {
                    ctx.drawImage(enemy.image, enemy.x, enemy.y, enemy.width, enemy.height);
                } else {
                    ctx.fillStyle = 'green';
                    ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                }
                drawEnemyHP(enemy);
                if (showHitboxes) {
                    ctx.strokeStyle = 'blue';
                    ctx.strokeRect(enemy.x, enemy.y, enemy.width, enemy.height);
                }
            });
        }

        function drawPowerUps() {
            powerUps.forEach(powerUp => {
                ctx.fillStyle = powerUp.type === 'green' ? 'lime' : 'pink';
                ctx.fillRect(powerUp.x, powerUp.y, powerUp.width, powerUp.height);
                if (showHitboxes) {
                    ctx.strokeStyle = 'blue';
                    ctx.strokeRect(powerUp.x, powerUp.y, powerUp.width, powerUp.height);
                }
            });
        }

        function drawEnemyHP(enemy) {
            ctx.fillStyle = 'red';
            ctx.fillRect(enemy.x, enemy.y - 10, enemy.width, 5);
            ctx.fillStyle = 'green';
            ctx.fillRect(enemy.x, enemy.y - 10, enemy.width * (enemy.hp / enemy.maxHp), 5);
        }

        function drawScore() {
            ctx.fillStyle = 'white';
            ctx.font = '24px Arial';
            ctx.fillText('Score: ' + score, canvas.width - 150, 50);
            // Debug info
            //ctx.fillText('Spawn Interval: ' + spawnInterval.toFixed(0) + 'ms', canvas.width - 300, 80);
        }

        function moveShip() {
            if (rightPressed && ship.x < canvas.width - ship.width) {
                ship.x += ship.dx;
            } else if (leftPressed && ship.x > 0) {
                ship.x -= ship.dx;
            }
            if (upPressed && ship.y > 0) {
                ship.y -= ship.dy;
            } else if (downPressed && ship.y < canvas.height - ship.height) {
                ship.y += ship.dy;
            }
        }

        function moveBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= 5;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }
        }

        function moveEnemies() {
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemySpeed;
                if (enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                }
            }
        }

        function movePowerUps() {
            for (let i = powerUps.length - 1; i >= 0; i--) {
                powerUps[i].y += 3;
                if (powerUps[i].y > canvas.height) {
                    powerUps.splice(i, 1);
                }
            }
        }

        function isOverlapping(newObject, array) {
            return array.some(obj => {
                return !(newObject.x + newObject.width < obj.x ||
                         newObject.x > obj.x + obj.width ||
                         newObject.y + newObject.height < obj.y ||
                         newObject.y > obj.y + obj.height);
            });
        }

        function spawnEnemy() {
        const sizeFactors = [1, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9, 2, 3];
        const sizeFactor = sizeFactors[Math.floor(Math.random() * sizeFactors.length)];
        const width = 50 * sizeFactor;
        const height = 30 * sizeFactor;
        let x, y, newEnemy;

        // Kies een willekeurige meteoriet afbeelding
        const randomImageIndex = Math.floor(Math.random() * meteorImages.length);
        const selectedImage = meteorImages[randomImageIndex];
        const selectedHitbox = meteorHitboxes[randomImageIndex];

        do {
            x = Math.random() * (canvas.width - width);
            y = 0;
            newEnemy = {
                x,
                y,
                width,
                height,
                hp: 0,
                maxHp: 0,
                image: selectedImage,
                hitbox: {
                    x: selectedHitbox.x * sizeFactor,
                    y: selectedHitbox.y * sizeFactor,
                    width: selectedHitbox.width * sizeFactor,
                    height: selectedHitbox.height * sizeFactor
                }
            };

            if (sizeFactor === 3) {
                newEnemy.hp = 10;
            } else if (sizeFactor <= 1.2) {
                newEnemy.hp = 1;
            } else if (sizeFactor <= 1.5) {
                newEnemy.hp = 2;
            } else if (sizeFactor <= 1.8) {
                newEnemy.hp = 3;
            } else {
                newEnemy.hp = 5;
            }

            newEnemy.maxHp = newEnemy.hp;
        } while (isOverlapping(newEnemy, enemies));

        enemies.push(newEnemy);
    }
        function spawnPinkPowerUp() {
            const powerUp = {
                x: Math.random() * (canvas.width - 20),
                y: 0,
                width: 20,
                height: 20
            };
            if (!isOverlapping(powerUp, powerUps)) {
                powerUps.push(powerUp);
            }
        }

        function spawnGreenPowerUp() {
            const powerUp = {
                x: Math.random() * (canvas.width - 20),
                y: 0,
                width: 20,
                height: 20,
                type: 'green'
            };
            if (!isOverlapping(powerUp, powerUps)) {
                powerUps.push(powerUp);
            }
        }

        function detectCollisions() {
    const shipHitbox = {
        x: ship.x + ship.width * 0.1,
        y: ship.y + ship.height * 0.1,
        width: ship.width * 0.8,
        height: ship.height * 0.8
    };

    for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        const enemyHitbox = {
            x: enemy.x + enemy.hitbox.x,
            y: enemy.y + enemy.hitbox.y,
            width: enemy.hitbox.width,
            height: enemy.hitbox.height
        };

        if (enemyHitbox.x < shipHitbox.x + shipHitbox.width &&
            enemyHitbox.x + enemyHitbox.width > shipHitbox.x &&
            enemyHitbox.y < shipHitbox.y + shipHitbox.height &&
            enemyHitbox.y + enemyHitbox.height > shipHitbox.y) {
            gameOver = true;
            restartTimer = setTimeout(() => {
                showRestartText = true;
            }, restartDelay);
        }

        for (let j = bullets.length - 1; j >= 0; j--) {
            const bullet = bullets[j];
            let bulletDamage = 1;
            if (bulletColor === 'lime') {
                bulletDamage = 5;
            }

            if (bullet.x < enemyHitbox.x + enemyHitbox.width &&
                bullet.x + bulletWidth > enemyHitbox.x &&
                bullet.y < enemyHitbox.y + enemyHitbox.height &&
                bullet.y + bulletHeight > enemyHitbox.y) {
                enemy.hp -= bulletDamage;
                bullets.splice(j, 1); // Remove bullet
                if (enemy.hp <= 0) {
                    score += enemy.maxHp;
                    enemies.splice(i, 1); // Remove enemy
                    break; // Important: Stop checking bullets against this enemy
                }
                break; // Stop checking other bullets
            }
        }
    }

    powerUps.forEach((powerUp, powerUpIndex) => {
        if (powerUp.x < shipHitbox.x + shipHitbox.width &&
            powerUp.x + powerUp.width > shipHitbox.x &&
            powerUp.y < shipHitbox.y + shipHitbox.height &&
            powerUp.y + powerUp.height > shipHitbox.y) {
            powerUps.splice(powerUpIndex, 1);
            if (powerUp.type === 'green') {
                activateGreenPowerUp();
            } else {
                activatePinkPowerUp();
            }
        }
    });
}
        function activatePinkPowerUp() {
            if (activePowerUpTimer) {
                clearTimeout(activePowerUpTimer);
            }
            
            bulletColor = 'pink';
            bulletCooldown = 0;
            bulletWidth = 15;
            bulletHeight = 30;
            console.log('Power-up geactiveerd!');
            
            activePowerUpTimer = setTimeout(deactivatePinkPowerUp, 5000);
        }

        function activateGreenPowerUp() {
            if (activePowerUpTimer) {
                clearTimeout(activePowerUpTimer);
            }
            
            bulletColor = 'lime';
            bulletCooldown = 1200;
            bulletWidth = 40;
            bulletHeight = 40;
            console.log('Green Power-up activated!');
            
            activePowerUpTimer = setTimeout(deactivateGreenPowerUp, 5000);
        }
        
        function deactivatePinkPowerUp() {
            bulletColor = 'red';
            bulletCooldown = originalBulletCooldown;
            bulletWidth = 10;  // terug naar originele breedte
            bulletHeight = 20; // terug naar originele hoogte
            console.log('Power-up gedeactiveerd!');
        }

        function deactivateGreenPowerUp() {
            bulletColor = 'red';
            bulletCooldown = originalBulletCooldown;
            bulletWidth = 10;
            bulletHeight = 20;
            console.log('Green Power-up deactivated!');
        }


        function adjustGameParameters() {
            // Decrease spawn interval as score increases
            // Start: 1000ms, gradually decrease to 300ms minimum
            spawnInterval = Math.max(100, 1000 - (score * 0.5));
            
            // Increase enemy speed gradually
            enemySpeed = 2 + (score / 100);
        }

        function handleEnemySpawning(currentTime) {
            if (!lastSpawnTime) lastSpawnTime = currentTime;
           
            const deltaTime = currentTime - lastSpawnTime;
           
            if (deltaTime > spawnInterval) {
                spawnEnemy();
                spawnEnemy(); // Spawn a second enemy
                lastSpawnTime = currentTime;
            }
        }

        function resetGame() {
            // Reset alle game variabelen
            enemies.length = 0;
            bullets.length = 0;
            powerUps.length = 0;
            score = 0;
            enemySpeed = 2;
            gameOver = false;
            ship.x = canvas.width / 2;
            ship.y = canvas.height - 45;
            lastSpawnTime = 0;
            spawnInterval = 1000;
            bulletColor = 'red';
            bulletCooldown = originalBulletCooldown;
            bulletWidth = 10;
            bulletHeight = 20;
            showRestartText = false;
            clearTimeout(restartTimer);
        }

        function drawHitboxes() {
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 1;

            // Draw ship hitbox
            const shipHitbox = {
                x: ship.x + ship.width * 0.1,
                y: ship.y + ship.height * 0.1,
                width: ship.width * 0.8,
                height: ship.height * 0.8
            };
            ctx.strokeRect(shipHitbox.x, shipHitbox.y, shipHitbox.width, shipHitbox.height);

            // Draw enemy hitboxes
            enemies.forEach(enemy => {
                const enemyHitbox = {
                    x: enemy.x + enemy.hitbox.x,
                    y: enemy.y + enemy.hitbox.y,
                    width: enemy.hitbox.width,
                    height: enemy.hitbox.height
                };
                ctx.strokeRect(enemyHitbox.x, enemyHitbox.y, enemyHitbox.width, enemyHitbox.height);
            });

            // Draw bullet hitboxes
            bullets.forEach(bullet => {
                ctx.strokeRect(bullet.x, bullet.y, bulletWidth, bulletHeight);
            });

            // Draw power-up hitboxes
            powerUps.forEach(powerUp => {
                ctx.strokeRect(powerUp.x, powerUp.y, powerUp.width, powerUp.height);
            });
        }

        function drawCenteredRedText(text, x, y, font) {
            ctx.font = font;
            ctx.fillStyle = 'red';
            ctx.textAlign = 'center';
            ctx.fillText(text, x, y);
            ctx.textAlign = 'start'; // Reset text alignment
        }

        function update(currentTime) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
    
            if (gameOver) {
                drawCenteredRedText('Score: ' + score, canvas.width / 2, canvas.height / 2 - 75, '60px sans-serif');

                ctx.fillStyle = 'red';
                ctx.font = '48px sans-serif';
                ctx.textAlign = 'center'; // Set text alignment to center
                ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 25); // Adjusted y-coordinate
                
                if (showRestartText) {
                    ctx.font = '24px sans-serif';
                    ctx.fillText('Press any key to restart', canvas.width / 2, canvas.height / 2 + 25); // Adjusted y-coordinate
                }
                ctx.textAlign = 'start'; // Reset text alignment
                animationId = requestAnimationFrame(update);
                return;
            }

            adjustGameParameters();
            handleEnemySpawning(currentTime);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawShip();
            drawBullets();
            drawEnemies();
            drawPowerUps();
            drawScore();
            if (showHitboxes) {
                drawHitboxes(); // Add this line to draw hitboxes
            }
            moveShip();
            moveBullets();
            moveEnemies();
            movePowerUps();
            detectCollisions();
            requestAnimationFrame(update);
        }
  
        document.addEventListener('keydown', (e) => {
            if (gameOver) {
                if (showRestartText) {
                    if (animationId) {
                        cancelAnimationFrame(animationId);
                        animationId = null;
                    }
                    resetGame();
                    animationId = requestAnimationFrame(update);
                }
                return;
            }

            if (e.key === 'ArrowRight') {
                rightPressed = true;
            } else if (e.key === 'ArrowLeft') {
                leftPressed = true;
            } else if (e.key === 'ArrowUp') {
                upPressed = true;
            } else if (e.key === 'ArrowDown') {
                downPressed = true;
            } else if (e.key === 'u') {
                const currentTime = Date.now();
                if (currentTime - lastBulletTime >= bulletCooldown) {
                    bullets.push({ x: ship.x + ship.width / 2 - 5, y: ship.y });
                    lastBulletTime = currentTime;
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowRight') {
                rightPressed = false;
            } else if (e.key === 'ArrowLeft') {
                leftPressed = false;
            } else if (e.key === 'ArrowUp') {
                upPressed = false;
            } else if (e.key === 'ArrowDown') {
                downPressed = false;
            }
        });

        let rightPressed = false;
        let leftPressed = false;
        let upPressed = false;
        let downPressed = false;

        // Power-up spawn timers
        setInterval(spawnPinkPowerUp, 30000);
        setInterval(spawnGreenPowerUp, 30000);

        // Score increment timer
        setInterval(() => {
            if (!gameOver) {
                score += 1;
            }
        }, 1000);

        // Start the game loop
        requestAnimationFrame(update);
    </script>
</body>
</html>
